name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # package.json has no `packageManager` field, so action-setup needs an
      # explicit version. 11.x matches what the lockfile was written with.
      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # Runs tsc and the Tailwind CSS build, so a broken dist/styles/toolkit.css
      # fails here rather than at publish time.
      - name: Build
        run: pnpm build

      - name: Verify styles.css export resolves
        run: test -s dist/styles/toolkit.css

# Playwright component tests (pnpm test:ct) are deliberately not run here —
# they need browser downloads and are exercised locally.
