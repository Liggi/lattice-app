# Lattice log rotation configuration. scripts/setup-services.sh fills in
# {{LOGS_DIR}}, installs the result under ~/.config/<instance>/ and adds the
# crontab line that runs it.

{{LOGS_DIR}}/*.log {
    daily
    rotate 7
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
    size 10M
}
